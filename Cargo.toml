[package]
name = "dataseed"
version = "0.1.0"
edition = "2021"
description = "Plant a seed, grow a dataset."
license = "MIT"
repository = "https://github.com/motomo/dataseed"

[[bin]]
name = "dataseed"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pest = "2.7"
pest_derive = "2.7"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
strsim = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libm = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
